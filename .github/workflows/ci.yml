name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # requirements-dev.txt does not match setup-python's default
          # globs (**/requirements.txt, **/pyproject.toml); without this the
          # step fails before any validation runs.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install PyYAML yamllint

      # The harness has to be trustworthy before its results mean anything.
      - name: Sigma engine self-test
        run: python3 scripts/run_tests.py --selftest

      - name: Sigma rule unit tests
        run: python3 scripts/run_tests.py

      - name: Repository validation
        run: python3 scripts/validate.py

      - name: Generated artefacts are in sync
        run: python3 scripts/build.py --check

      - name: Lint YAML
        run: yamllint rules/sigma tests/rules .github

      - name: Navigator layer is valid JSON
        run: python3 -c "import json,sys; json.load(open('mappings/attack-navigator-layer.json')); print('navigator layer OK')"

  sigma-conversion:
    name: Sigma conversion smoke test
    runs-on: ubuntu-latest
    continue-on-error: true   # upstream backend availability changes; informational only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # requirements-dev.txt does not match setup-python's default
          # globs (**/requirements.txt, **/pyproject.toml); without this the
          # step fails before any validation runs.
          cache-dependency-path: requirements-dev.txt

      - name: Install sigma-cli and a backend
        run: |
          pip install sigma-cli
          sigma plugin install splunk || true

      - name: Validate rules against the Sigma specification
        run: sigma check rules/sigma/

      - name: Convert a representative rule
        run: |
          sigma convert -t splunk rules/sigma/TH-001-lsass-memory-access.yml
          sigma convert -t splunk rules/sigma/TH-024-inhibit-system-recovery.yml

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # requirements-dev.txt does not match setup-python's default
          # globs (**/requirements.txt, **/pyproject.toml); without this the
          # step fails before any validation runs.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install PyYAML yamllint

      # The harness has to be trustworthy before its results mean anything.
      - name: Sigma engine self-test
        run: python3 scripts/run_tests.py --selftest

      - name: Sigma rule unit tests
        run: python3 scripts/run_tests.py

      - name: Repository validation
        run: python3 scripts/validate.py

      - name: Generated artefacts are in sync
        run: python3 scripts/build.py --check

      - name: Lint YAML
        run: yamllint rules/sigma tests/rules .github

      - name: Navigator layer is valid JSON
        run: python3 -c "import json,sys; json.load(open('mappings/attack-navigator-layer.json')); print('navigator layer OK')"

  # Interoperability check against the reference implementation. The authoritative
  # portability gate lives in scripts/validate.py, which runs in the job above with
  # no network dependency; this job exists to show the rules through pySigma's own
  # parser and a real backend. sigma check downloads the ATT&CK STIX bundle and the
  # D3FEND ontology at validation time, so its steps are marked continue-on-error:
  # a MITRE outage must not mark a commit failed. Read the log, not the badge.
  sigma-conversion:
    name: Sigma conversion smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # requirements-dev.txt does not match setup-python's default
          # globs (**/requirements.txt, **/pyproject.toml); without this the
          # step fails before any validation runs.
          cache-dependency-path: requirements-dev.txt

      - name: Install sigma-cli and a backend
        run: |
          pip install sigma-cli
          sigma plugin install splunk || pip install pysigma-backend-splunk

      - name: Validate rules against the Sigma specification
        continue-on-error: true
        run: sigma check rules/sigma/

      # sigma convert requires an explicit processing pipeline; without -p it exits 2
      # before parsing anything. splunk_windows is the log-source pipeline these rules
      # are written against.
      - name: Convert representative rules through a real backend
        continue-on-error: true
        run: |
          sigma convert -t splunk -p splunk_windows rules/sigma/TH-001-lsass-memory-access.yml
          sigma convert -t splunk -p splunk_windows rules/sigma/TH-009-suspicious-powershell.yml
          sigma convert -t splunk -p splunk_windows rules/sigma/TH-024-inhibit-system-recovery.yml

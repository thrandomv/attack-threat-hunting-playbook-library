# No `labels:` keys here on purpose. Dependabot cannot create labels that do not
# already exist in the repository, and reports an error on every pull request when
# it is asked to apply one that is missing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

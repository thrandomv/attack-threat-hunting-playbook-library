      - {timestamp: '2026-09-01T09:01:00Z', EventID: 4769, TargetUserName: 'svc-app', IpAddress: '10.20.30.41', ServiceName: 'MSSQLSvc/sql01:1433', TicketEncryptionType: '0x17', Status: '0x0'}
      - {timestamp: '2026-09-01T09:01:10Z', EventID: 4769, TargetUserName: 'svc-app', IpAddress: '10.20.30.41', ServiceName: 'MSSQLSvc/sql01:1433', TicketEncryptionType: '0x17', Status: '0x0'}
      - {timestamp: '2026-09-01T09:01:20Z', EventID: 4769, TargetUserName: 'svc-app', IpAddress: '10.20.30.41', ServiceName: 'MSSQLSvc/sql01:1433', TicketEncryptionType: '0x17', Status: '0x0'}
      - {timestamp: '2026-09-01T09:01:30Z', EventID: 4769, TargetUserName: 'svc-app', IpAddress: '10.20.30.41', ServiceName: 'MSSQLSvc/sql01:1433', TicketEncryptionType: '0x17', Status: '0x0'}

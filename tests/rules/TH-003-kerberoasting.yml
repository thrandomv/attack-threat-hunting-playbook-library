  - name: High volume against a single SPN is not enumeration
    expect: no_match
    target: 2bb7f103-43d0-4b03-8d03-7d6a1f030103
    events:
      - {timestamp: '2026-09-01T09:00:00Z', EventID: 4769, TargetUserName: 'svc-app', IpAddress: '10.20.30.41', ServiceName: 'MSSQLSvc/sql01:1433', TicketEncryptionType: '0x17', Status: '0x0'}

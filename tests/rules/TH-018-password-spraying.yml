rule: TH-018-password-spraying
description: >
  These cases lock in the v2 result-code correction. 50057 (account disabled) and 53003 (Conditional
  Access block) must not be counted as password failures, and 50074 must be recognised as a valid
  credential rather than a failure. The temporal correlation must require both halves.
cases:
  - name: Invalid password failure
    expect: match
    target: th018_password_failure_signin
    event:
      ResultType: 50126
      UserPrincipalName: 'alice@contoso.com'
      IPAddress: '203.0.113.66'

  - name: Account disabled is not a password guess
    expect: no_match
    target: th018_password_failure_signin
    event:
      ResultType: 50057
      UserPrincipalName: 'former.employee@contoso.com'
      IPAddress: '203.0.113.66'

  - name: Conditional Access block is not a password guess
    expect: no_match
    target: th018_password_failure_signin
    event:
      ResultType: 53003
      UserPrincipalName: 'alice@contoso.com'
      IPAddress: '203.0.113.66'

  - name: MFA challenge not satisfied means the password was correct
    expect: match
    target: th018_credential_valid_signin
    event:
      ResultType: 50074
      UserPrincipalName: 'bob@contoso.com'
      IPAddress: '203.0.113.66'

  - name: Invalid password is not a credential-valid outcome
    expect: no_match
    target: th018_credential_valid_signin
    event:
      ResultType: 50126
      UserPrincipalName: 'bob@contoso.com'
      IPAddress: '203.0.113.66'

  - name: Twelve distinct users failed from one source in ten minutes
    expect: match
    target: 2bb7f118-43d0-4b18-8d18-7d6a1f180118
    events:
      - {timestamp: '2026-09-04T02:00:00Z', ResultType: 50126, UserPrincipalName: 'u1@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:00:20Z', ResultType: 50126, UserPrincipalName: 'u2@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:00:40Z', ResultType: 50126, UserPrincipalName: 'u3@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:01:00Z', ResultType: 50126, UserPrincipalName: 'u4@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:01:20Z', ResultType: 50126, UserPrincipalName: 'u5@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:01:40Z', ResultType: 50126, UserPrincipalName: 'u6@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:02:00Z', ResultType: 50126, UserPrincipalName: 'u7@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:02:20Z', ResultType: 50053, UserPrincipalName: 'u8@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:02:40Z', ResultType: 50126, UserPrincipalName: 'u9@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:03:00Z', ResultType: 50126, UserPrincipalName: 'u10@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:03:20Z', ResultType: 50126, UserPrincipalName: 'u11@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:03:40Z', ResultType: 50126, UserPrincipalName: 'u12@contoso.com', IPAddress: '203.0.113.66'}

  - name: Disabled accounts alone must not trigger a spray alert
    expect: no_match
    target: 2bb7f118-43d0-4b18-8d18-7d6a1f180118
    events:
      - {timestamp: '2026-09-04T03:00:00Z', ResultType: 50057, UserPrincipalName: 'x1@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:00:20Z', ResultType: 50057, UserPrincipalName: 'x2@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:00:40Z', ResultType: 50057, UserPrincipalName: 'x3@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:01:00Z', ResultType: 50057, UserPrincipalName: 'x4@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:01:20Z', ResultType: 50057, UserPrincipalName: 'x5@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:01:40Z', ResultType: 50057, UserPrincipalName: 'x6@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:02:00Z', ResultType: 50057, UserPrincipalName: 'x7@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:02:20Z', ResultType: 50057, UserPrincipalName: 'x8@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:02:40Z', ResultType: 50057, UserPrincipalName: 'x9@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:03:00Z', ResultType: 50057, UserPrincipalName: 'x10@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:03:20Z', ResultType: 50057, UserPrincipalName: 'x11@contoso.com', IPAddress: '203.0.113.90'}
      - {timestamp: '2026-09-04T03:03:40Z', ResultType: 50057, UserPrincipalName: 'x12@contoso.com', IPAddress: '203.0.113.90'}

  - name: Spray followed by an MFA-blocked sign-in from the same source
    expect: match
    target: 2bb7f318-43d0-4d18-8f18-7d6a1f180318
    events:
      - {timestamp: '2026-09-04T02:00:00Z', ResultType: 50126, UserPrincipalName: 'u1@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:05:00Z', ResultType: 50126, UserPrincipalName: 'u2@contoso.com', IPAddress: '203.0.113.66'}
      - {timestamp: '2026-09-04T02:09:00Z', ResultType: 50074, UserPrincipalName: 'u3@contoso.com', IPAddress: '203.0.113.66'}

  - name: Failures with no credential-valid outcome
    expect: no_match
    target: 2bb7f318-43d0-4d18-8f18-7d6a1f180318
    events:
      - {timestamp: '2026-09-04T02:00:00Z', ResultType: 50126, UserPrincipalName: 'u1@contoso.com', IPAddress: '203.0.113.77'}
      - {timestamp: '2026-09-04T02:05:00Z', ResultType: 50126, UserPrincipalName: 'u2@contoso.com', IPAddress: '203.0.113.77'}
      - {timestamp: '2026-09-04T02:09:00Z', ResultType: 50126, UserPrincipalName: 'u3@contoso.com', IPAddress: '203.0.113.77'}

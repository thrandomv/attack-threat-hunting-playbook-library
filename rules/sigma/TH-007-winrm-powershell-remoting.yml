title: Suspicious Child Process of WinRM Remoting Host
id: 2bb7f007-43d0-4a07-8c07-7d6a1f070007
status: experimental
description: |
  Detects command interpreters and transfer utilities executed under wsmprovhost.exe or
  winrshost.exe, which is where PowerShell remoting and WinRS land on the destination host. Payloads
  that never spawn a child process are invisible here - pair with PowerShell script block logging.
references:
  - https://attack.mitre.org/techniques/T1021/006/
  - https://attack.mitre.org/detectionstrategies/DET0477
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\wsmprovhost.exe'
      - '\winrshost.exe'
  selection_interpreter:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\cscript.exe'
      - '\wscript.exe'
  selection_transfer_tool:
    Image|endswith:
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\curl.exe'
  selection_payload_shape:
    CommandLine|contains:
      - '-enc'
      - 'EncodedCommand'
      - 'FromBase64String'
      - 'DownloadString'
      - 'Invoke-WebRequest'
      - 'IEX'
      - 'http://'
      - 'https://'
  condition: selection_parent and (selection_interpreter or selection_transfer_tool or selection_payload_shape)
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Configuration management over WinRM (DSC, Ansible, SCCM) and monitoring agents.
  - Administrators running Invoke-Command from an approved management host.
level: high

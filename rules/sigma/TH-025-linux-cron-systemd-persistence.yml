title: Linux Cron or Systemd Persistence Command
id: 2bb7f025-43d0-4a25-8c25-7d6a1f250025
status: experimental
description: |
  Detects commands that install or enable persistence on Linux: crontab replacement, systemctl
  enable or start, systemd-run, and writes into cron or systemd unit directories using tee, cp, mv
  or a shell redirect. Package managers and configuration-management agents perform the same actions
  legitimately and should be filtered by parent process before deployment.
references:
  - https://attack.mitre.org/techniques/T1543/002/
  - https://attack.mitre.org/techniques/T1053/003/
  - https://attack.mitre.org/detectionstrategies/DET0253
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.execution
  - attack.t1543.002
  - attack.t1053.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_crontab_write:
    Image|endswith: '/crontab'
    CommandLine|contains:
      - ' -e'
      - '/tmp/'
      - '/dev/shm/'
      - '/var/tmp/'
  selection_systemctl_enable:
    Image|endswith: '/systemctl'
    CommandLine|contains:
      - 'enable'
      - 'start'
  selection_systemd_run:
    Image|endswith: '/systemd-run'
  selection_unit_write:
    CommandLine|contains:
      - '/etc/systemd/system/'
      - '/usr/lib/systemd/system/'
      - '/lib/systemd/system/'
      - '.config/systemd/user/'
  selection_cron_dir_write:
    CommandLine|contains:
      - '/etc/cron.d/'
      - '/etc/cron.daily/'
      - '/etc/cron.hourly/'
      - '/var/spool/cron/'
  filter_read_only:
    CommandLine|contains:
      - 'crontab -l'
      - 'systemctl status'
      - 'systemctl list-units'
      - 'systemctl is-active'
      - 'systemctl is-enabled'
  filter_package_manager:
    ParentImage|endswith:
      - '/dpkg'
      - '/apt'
      - '/apt-get'
      - '/yum'
      - '/dnf'
      - '/rpm'
      - '/snapd'
  condition: 1 of selection_* and not 1 of filter_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Package installation and updates.
  - Configuration management (Ansible, Puppet, Chef, Salt) deploying units and cron entries.
  - Administrators scheduling maintenance during a change window.
level: medium

title: Linux Cron or Systemd Unit File Written Outside Package Management
id: 2bb7f125-43d0-4b25-8d25-7d6a1f250125
status: experimental
description: |
  Detects creation or modification of a file in a cron or systemd unit directory by a process that is
  not a package manager. Adversaries frequently write the unit file directly rather than calling
  systemctl, which leaves no command-line evidence at all - this rule is the only coverage for that
  path. Include the user unit directory: user units need no root privilege.
references:
  - https://attack.mitre.org/techniques/T1543/002/
  - https://attack.mitre.org/detectionstrategies/DET0253
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.persistence
  - attack.t1543.002
  - attack.t1053.003
logsource:
  category: file_event
  product: linux
detection:
  selection_persistence_path:
    TargetFilename|contains:
      - '/etc/systemd/system/'
      - '/usr/lib/systemd/system/'
      - '/lib/systemd/system/'
      - '/.config/systemd/user/'
      - '/etc/cron.d/'
      - '/etc/cron.daily/'
      - '/etc/cron.hourly/'
      - '/var/spool/cron/'
      - '/etc/crontab'
  filter_package_manager:
    Image|endswith:
      - '/dpkg'
      - '/apt'
      - '/apt-get'
      - '/yum'
      - '/dnf'
      - '/rpm'
      - '/snapd'
      - '/systemd'
  condition: selection_persistence_path and not filter_package_manager
fields:
  - TargetFilename
  - Image
  - User
falsepositives:
  - Configuration management writing unit and cron files.
  - Container and orchestration tooling generating units at runtime.
level: medium

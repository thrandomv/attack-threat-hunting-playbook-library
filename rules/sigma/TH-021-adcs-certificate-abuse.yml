title: AD CS Certificate Request With a Requester-Supplied Subject Alternative Name
id: 2bb7f021-43d0-4a21-8c21-7d6a1f210021
status: experimental
description: |
  Detects a certificate request or issuance (Security 4886 / 4887) whose attributes carry a
  requester-supplied subject alternative name. On a template with a client-authentication EKU and no
  manager approval, this is the ESC1 misissuance path: the requester obtains a certificate that
  authenticates as another principal. Web-server templates legitimately accept a SAN and must be
  filtered by template name before deployment.
references:
  - https://attack.mitre.org/techniques/T1649/
  - https://attack.mitre.org/detectionstrategies/DET0240
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.t1649
logsource:
  product: windows
  service: security
detection:
  selection_ca_event:
    EventID:
      - 4886
      - 4887
  selection_san_attribute:
    Attributes|contains:
      - 'san:'
      - 'SubjectAltName'
      - 'upn='
      - 'dns='
  filter_san_templates:
    CertificateTemplate|contains:
      - 'WebServer'
      - 'SSLCertificate'
      - 'LoadBalancer'
  condition: selection_ca_event and selection_san_attribute and not filter_san_templates
fields:
  - SubjectUserName
  - CertificateTemplate
  - Attributes
  - RequestId
  - Computer
falsepositives:
  - Web-server and load-balancer templates that legitimately accept a subject alternative name.
  - Automated enrolment services that build the SAN in the request.
level: critical

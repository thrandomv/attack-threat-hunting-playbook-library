title: Active Directory Certificate Services Abuse Tooling
id: 2bb7f121-43d0-4b21-8d21-7d6a1f210121
status: experimental
description: |
  Detects endpoint execution of tooling associated with AD CS abuse - Certify, Certipy, and Rubeus
  certificate-based ticket requests - plus certificate export from the local store. Tool names are
  trivially renamed, so treat this as corroboration for the CA-side rule rather than as primary
  coverage.
references:
  - https://attack.mitre.org/techniques/T1649/
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool_name:
    Image|endswith:
      - '\Certify.exe'
      - '\certipy.exe'
  selection_tool_arguments:
    CommandLine|contains:
      - 'certipy '
      - 'Certify.exe find'
      - 'Certify.exe request'
      - '/template:'
  selection_rubeus_certificate:
    CommandLine|contains|all:
      - 'asktgt'
      - '/certificate:'
  selection_export_pfx:
    CommandLine|contains:
      - '-exportPFX'
      - 'Export-PfxCertificate'
  condition: 1 of selection_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - PKI administrators performing template review or certificate migration.
  - Backup tooling exporting certificates with private keys during a documented change.
level: high

title: Suspicious Scheduled Task Creation or Modification
id: 2bb7f011-43d0-4a11-8c11-7d6a1f110011
status: experimental
description: |
  Detects scheduled tasks created or changed with an elevated principal, an interpreter action,
  encoded or remote content, a payload in a user-writable directory, or against a remote host with
  /s. Covers both schtasks.exe and the PowerShell scheduled-task cmdlets; tasks created through the
  COM API or WMI produce no command line and require Security 4698 instead.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/detectionstrategies/DET0441
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.persistence
  - attack.execution
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/create'
      - '/change'
  selection_cmdlet:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Register-ScheduledTask'
      - 'Set-ScheduledTask'
  sig_remote_target:
    CommandLine|re: '/s\s+[^\s]+'
  sig_elevated_interpreter:
    CommandLine|contains|all:
      - '/ru'
      - 'system'
  sig_payload_shape:
    CommandLine|contains:
      - '-enc'
      - 'EncodedCommand'
      - 'FromBase64String'
      - 'http://'
      - 'https://'
      - '\AppData\'
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '\ProgramData\'
  sig_boot_logon_interpreter:
    CommandLine|contains:
      - 'onlogon'
      - 'onstart'
      - 'AtLogon'
      - 'AtStartup'
  condition: 1 of selection_* and 1 of sig_*
fields:
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Software deployment platforms registering update tasks that run as SYSTEM.
  - Backup and monitoring agents creating maintenance tasks at install time.
  - Administrative scripts scheduling maintenance during change windows.
level: medium

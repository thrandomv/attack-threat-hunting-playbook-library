title: Local or Domain Account Created or Enabled
id: 2bb7f113-43d0-4b13-8d13-7d6a1f130113
status: experimental
description: |
  Detects account creation (4720) and re-enablement (4722). Individually routine in most estates,
  but essential context next to a privileged group addition, and high severity on domain controllers
  and tier-0 servers. Raise the level or scope by asset tier rather than deploying this estate-wide
  as an alert.
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/detectionstrategies/DET0447
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  product: windows
  service: security
detection:
  selection_account_lifecycle:
    EventID:
      - 4720
      - 4722
  filter_machine_account:
    TargetUserName|endswith: '$'
  condition: selection_account_lifecycle and not filter_machine_account
fields:
  - SubjectUserName
  - TargetUserName
  - Computer
falsepositives:
  - Routine user onboarding through the identity-management platform.
  - Application installers creating local service accounts.
level: medium

title: Privileged Group Membership Added (SID-Based)
id: 2bb7f013-43d0-4a13-8c13-7d6a1f130013
status: experimental
description: |
  Detects a principal being added to a privileged Windows or Active Directory group, matched by
  well-known SID rather than by group name. Group names are localised - "Domain Admins" is
  "Admins du domaine" on a French installation - and can be renamed, so name-based rules fail
  silently in multi-region estates. RID suffixes cover Domain Admins (-512), Schema Admins (-518),
  Enterprise Admins (-519) and Group Policy Creator Owners (-520); the built-in SIDs cover the local
  Administrators and Operators groups.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://attack.mitre.org/detectionstrategies/DET0096
  - https://learn.microsoft.com/windows-server/identity/ad-ds/manage/understand-security-identifiers
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection_group_change:
    EventID:
      - 4728
      - 4732
      - 4756
  selection_domain_rid:
    TargetSid|endswith:
      - '-512'
      - '-518'
      - '-519'
      - '-520'
  selection_builtin_sid:
    TargetSid:
      - 'S-1-5-32-544'
      - 'S-1-5-32-548'
      - 'S-1-5-32-549'
      - 'S-1-5-32-550'
      - 'S-1-5-32-551'
  condition: selection_group_change and (selection_domain_rid or selection_builtin_sid)
fields:
  - SubjectUserName
  - MemberName
  - TargetUserName
  - TargetSid
  - Computer
falsepositives:
  - Onboarding and delegated administration performed by an identity-management platform.
  - Break-glass procedures executed during an incident.
level: high

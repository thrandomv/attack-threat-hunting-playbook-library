title: NTLM Relay and Name-Resolution Poisoning Tooling
id: 2bb7f122-43d0-4b22-8d22-7d6a1f220122
status: experimental
description: |
  Detects execution of tooling used to poison name resolution or relay captured NTLM authentication -
  Responder, Inveigh, ntlmrelayx, PetitPotam, Coercer, PrinterBug and SpoolSample. Renaming defeats
  name matching, so keep the 5145 rule above as primary coverage.
references:
  - https://attack.mitre.org/techniques/T1557/001/
  - https://attack.mitre.org/detectionstrategies/DET0462
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1557.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool_reference:
    CommandLine|contains:
      - 'Responder.py'
      - 'Invoke-Inveigh'
      - 'ntlmrelayx'
      - 'PetitPotam'
      - 'Coercer'
      - 'DFSCoerce'
      - 'SpoolSample'
      - 'printerbug'
  selection_tool_image:
    Image|endswith:
      - '\Inveigh.exe'
      - '\ntlmrelayx.exe'
      - '\PetitPotam.exe'
  condition: 1 of selection_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Authorised penetration testing and purple-team exercises.
  - Security engineers validating relay hardening in a change window.
level: critical

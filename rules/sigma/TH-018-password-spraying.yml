title: Password Spraying From One Source Against Many Entra Users
id: 2bb7f118-43d0-4b18-8d18-7d6a1f180118
status: experimental
description: |
  Correlates password-validation failures from one source address against at least ten distinct user
  principals within ten minutes. Scale the threshold to tenant size and exclude corporate NAT egress
  by named location rather than by raw address where the backend supports it.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://attack.mitre.org/detectionstrategies/DET0487
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - th018_password_failure_signin
  group-by:
    - IPAddress
  timespan: 10m
  condition:
    field: UserPrincipalName
    gte: 10
falsepositives:
  - Corporate NAT, VPN or proxy egress concentrating many users behind one address.
  - Identity migrations and bulk password-change events.
level: high
---
title: Password Spraying Followed by a Valid Credential From the Same Source
id: 2bb7f318-43d0-4d18-8f18-7d6a1f180318
status: experimental
description: |
  Correlates password-validation failures and a credential-valid outcome from the same source
  address within thirty minutes. This is the outcome that matters: the spray found a working
  password, whether or not MFA or Conditional Access stopped the session. Treat as an incident and
  reset the affected credential even when the sign-in did not complete.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: temporal
  rules:
    - th018_password_failure_signin
    - th018_credential_valid_signin
  group-by:
    - IPAddress
  timespan: 30m
falsepositives:
  - A shared egress address where one user mistypes a password while another signs in successfully;
    require the spray correlation above to fire on the same source before escalating.
level: critical

title: Entra Sign-In Failed on Password Validation
name: th018_password_failure_signin
id: 2bb7f018-43d0-4a18-8c18-7d6a1f180018
status: experimental
description: |
  Base event for the password-spraying correlations: an Entra sign-in that failed specifically on
  credential validation. Only genuine password-guess result codes are included - 50126 (invalid
  username or password), 50053 (locked), 50055 (expired) and 50056 (invalid or null password).
  Account-disabled (50057), Conditional Access blocks (53003) and token errors are deliberately
  excluded: counting them inflates spray detections in every tenant that has disabled accounts.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://attack.mitre.org/detectionstrategies/DET0487
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: azure
  service: signinlogs
detection:
  selection_password_failure:
    ResultType:
      - 50126
      - 50053
      - 50055
      - 50056
  condition: selection_password_failure
fields:
  - UserPrincipalName
  - IPAddress
  - ResultType
  - AppDisplayName
falsepositives:
  - Ordinary user password mistakes.
  - Stale credentials cached on mobile devices and mail clients after a password change.
level: informational
---
title: Entra Sign-In Where the Password Was Accepted
name: th018_credential_valid_signin
id: 2bb7f218-43d0-4c18-8e18-7d6a1f180218
status: experimental
description: |
  Base event marking a sign-in where the first factor succeeded: full success (0), or a sign-in that
  reached and failed the MFA or Conditional Access stage (50074, 50076, 50079, 500121, 53003). In
  the context of a spray these are not failures - they are confirmed correct passwords that a second
  control contained.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Hamza Khella
date: 2026-09-10
modified: 2026-09-10
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: azure
  service: signinlogs
detection:
  selection_credential_valid:
    ResultType:
      - 0
      - 50074
      - 50076
      - 50079
      - 500121
      - 53003
  condition: selection_credential_valid
fields:
  - UserPrincipalName
  - IPAddress
  - ResultType
falsepositives:
  - Every normal successful sign-in in the tenant; this event is only meaningful inside a correlation.
level: informational

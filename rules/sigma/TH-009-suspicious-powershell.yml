title: Suspicious PowerShell Execution Pattern
id: 2bb7f009-43d0-4a09-8c09-7d6a1f090009
status: experimental
description: |
  Detects PowerShell command lines that combine adversary-typical behaviours - base64 encoding,
  hidden non-interactive execution, download cradles, in-memory execution, execution-policy bypass -
  or that tamper with local defences, or that are launched by a parent which has no legitimate
  reason to start a shell. Encoded payload content is not visible here; enable script block logging
  (4104) for that.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/detectionstrategies/DET0455
author: Hamza Khella
date: 2026-08-31
modified: 2026-09-10
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  sig_encoding:
    CommandLine|re: '\s-{1,2}e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
  sig_cradle:
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'Invoke-WebRequest'
      - 'Invoke-RestMethod'
      - 'Net.WebClient'
      - 'MSXML2.XMLHTTP'
      - 'Start-BitsTransfer'
  sig_in_memory:
    CommandLine|contains:
      - 'IEX'
      - 'Invoke-Expression'
      - 'Reflection.Assembly'
      - '[scriptblock]::Create'
      - 'FromBase64String'
  sig_hidden:
    CommandLine|contains:
      - '-w hidden'
      - '-WindowStyle Hidden'
      - '-NonInteractive'
      - '-ExecutionPolicy Bypass'
      - '-ep bypass'
  high_defence_change:
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'Add-MpPreference'
      - 'DisableRealtimeMonitoring'
      - 'ExclusionPath'
      - 'AmsiUtils'
      - 'amsiInitFailed'
      - 'Clear-EventLog'
  parent_suspicious:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\w3wp.exe'
  # The Sigma specification permits `N of <pattern>`, but pySigma implements only
  # `1 of`, `any of` and `all of` (sigma/conditions.py: quantifier = Keyword("1") |
  # Keyword("any") | Keyword("all")). `2 of sig_*` therefore parses here and fails in
  # every pySigma backend, so it is expanded into the six explicit pairs of the four
  # signal selections. The semantics are unchanged: two or more independent signals,
  # or one signal under a suspicious parent, or defence tampering on its own.
  condition: >-
    selection_powershell and (high_defence_change
    or (parent_suspicious and 1 of sig_*)
    or (sig_encoding and sig_cradle)
    or (sig_encoding and sig_in_memory)
    or (sig_encoding and sig_hidden)
    or (sig_cradle and sig_in_memory)
    or (sig_cradle and sig_hidden)
    or (sig_in_memory and sig_hidden))
fields:
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Software deployment and configuration management that uses encoded commands for quoting.
  - Monitoring agents and installers running scripted PowerShell from a fixed path.
  - Administrators using -NoProfile -ExecutionPolicy Bypass in documented workflows.
level: high

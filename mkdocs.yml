# MkDocs configuration.
#
# docs_dir points at site-src/, which is assembled by .github/workflows/pages.yml as a mirror of the
# repository's markdown tree. Mirroring the layout means every relative link in the repository works
# unchanged on the published site - no duplicated content, no rewritten paths.
#
# Build locally with:
#   make site        # assemble site-src/ and serve on http://127.0.0.1:8000

site_name: ATT&CK Threat Hunting Playbook Library
site_description: >-
  Twenty-five hypothesis-driven threat hunts with KQL and Sigma, unit-tested detection logic, and
  ATT&CK v19 detection-strategy alignment.
site_author: Hamza Khella
repo_url: https://github.com/thrandomv/attack-threat-hunting-playbook-library
repo_name: attack-threat-hunting-playbook-library
edit_uri: ""
docs_dir: site-src
site_dir: site
copyright: MIT licensed. MITRE ATT&CK&reg; is a registered trademark of The MITRE Corporation.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

